name: Build Test Launcher
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p proj/app/src/main/java/com/test/launcher
          cd proj
          cat > settings.gradle << 'X'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "TestLauncher"
          include ':app'
          X
          cat > build.gradle << 'X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          X
          cat > gradle.properties << 'X'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          X
          cat > app/build.gradle << 'X'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.test.launcher'
            compileSdk 34
            defaultConfig {
              applicationId 'com.test.launcher'
              minSdk 21
              targetSdk 33
              versionCode 1
              versionName '1.0'
            }
          }
          X
          cat > app/src/main/AndroidManifest.xml << 'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <application android:label="Test Launcher">
              <activity android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.HOME" />
                  <category android:name="android.intent.category.DEFAULT" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          X
          cat > app/src/main/java/com/test/launcher/MainActivity.java << 'X'
          package com.test.launcher;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          public class MainActivity extends Activity {
            LinearLayout root;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setGravity(Gravity.CENTER);
              root.setBackgroundColor(Color.parseColor("#101830"));
              root.setPadding(80, 40, 80, 40);
              TextView t = new TextView(this);
              t.setText("Test Launcher OK");
              t.setTextColor(Color.WHITE);
              t.setTextSize(36);
              t.setGravity(Gravity.CENTER);
              root.addView(t);
              add("YouTube", "com.google.android.youtube.tv", null);
              add("Dates+", "com.datesplus.iptv", null);
              add("Settings", "com.tosmart.tv.tvsettings", "com.tosmart.tv.tvsettings.MainActivity");
              add("Old Home (Satellite menu)", "com.tosmart.ethereal", "com.tosmart.ethereal.init.InitActivity");
              setContentView(root);
              root.getChildAt(1).requestFocus();
            }
            void add(final String label, final String pkg, final String cls) {
              Button btn = new Button(this);
              btn.setText(label);
              btn.setTextSize(24);
              btn.setFocusable(true);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(900, 150);
              lp.setMargins(0, 20, 0, 20);
              btn.setLayoutParams(lp);
              btn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  try {
                    Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                    if (i == null && cls != null) {
                      i = new Intent(Intent.ACTION_MAIN);
                      i.setComponent(new ComponentName(pkg, cls));
                    }
                    startActivity(i);
                  } catch (Exception e) {
                    Toast.makeText(MainActivity.this, "Cannot open: " + label, Toast.LENGTH_LONG).show();
                  }
                }
              });
              root.addView(btn);
            }
            @Override public void onBackPressed() { }
          }
          X
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: test-launcher-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
