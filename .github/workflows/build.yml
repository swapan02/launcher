name: Build Test Launcher
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p proj/app/src/main/java/com/test/launcher
          cd proj
          cat > settings.gradle << 'X'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "TestLauncher"
          include ':app'
          X
          cat > build.gradle << 'X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          X
          cat > gradle.properties << 'X'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          X
          cat > app/build.gradle << 'X'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.test.launcher'
            compileSdk 34
            defaultConfig {
              applicationId 'com.test.launcher'
              minSdk 21
              targetSdk 33
              versionCode 2
              versionName '2.0'
            }
          }
          X
          cat > app/src/main/AndroidManifest.xml << 'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <application android:label="My Launcher">
              <activity android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.HOME" />
                  <category android:name="android.intent.category.DEFAULT" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          X
          cat > app/src/main/java/com/test/launcher/MainActivity.java << 'X'
          package com.test.launcher;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.BlurMaskFilter;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.LayerDrawable;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.media.ExifInterface;
          import android.graphics.Outline;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.text.SpannableStringBuilder;
          import android.text.Spanned;
          import android.text.style.ForegroundColorSpan;
          import android.text.style.RelativeSizeSpan;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {
            static final String OLD_PKG = "com.tosmart.ethereal";
            static final String MAIN_CLS = "com.tosmart.dvb.common.mainmenu.LeanbackMainActivity";
            static final String LIVE_CLS = "com.tosmart.ethereal.home.HomeActivity";
            static final String UPD_CLS = "com.tosmart.stb_extend.ext_view.view.NetUpdateActivity";
            static final String SET_PKG = "com.tosmart.tv.tvsettings";
            static final String SET_CLS = "com.tosmart.tv.tvsettings.MainActivity";
            static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;
            static final int WRAP = ViewGroup.LayoutParams.WRAP_CONTENT;

            SharedPreferences prefs;
            LinearLayout tileRow;
            ImageView[] photos = new ImageView[4];
            TextView clockTv, dateTv;
            Handler handler = new Handler();
            Runnable tick = new Runnable() {
              @Override public void run() {
                updateClock();
                maybeWeather();
                handler.postDelayed(this, 1000 - (System.currentTimeMillis() % 1000) + 5);
              }
            };
            float u;
            TextView weatherTv;
            long lastWeather = 0;
            static final String[] CITY_NAMES = {"Faridpur", "Dhaka", "Chattogram", "Khulna", "Rajshahi", "Sylhet", "Barishal",
                "Rangpur", "Mymensingh", "Cumilla", "Bogura", "Jashore", "Cox's Bazar", "Gazipur", "Narayanganj"};
            static final double[][] CITY_POS = {{23.6070, 89.8429}, {23.8103, 90.4125}, {22.3569, 91.7832}, {22.8456, 89.5403},
                {24.3745, 88.6042}, {24.8949, 91.8687}, {22.7010, 90.3535}, {25.7439, 89.2752}, {24.7471, 90.4203},
                {23.4607, 91.1809}, {24.8465, 89.3773}, {23.1664, 89.2081}, {21.4272, 92.0058}, {23.9999, 90.4203},
                {23.6238, 90.5000}};

            int s(int v) { return Math.round(v * u); }

            Drawable bg(int normal, int focused, int radius) {
              GradientDrawable n = new GradientDrawable();
              n.setColor(normal);
              n.setCornerRadius(radius);
              GradientDrawable f = new GradientDrawable();
              f.setColor(focused);
              f.setCornerRadius(radius);
              f.setStroke(s(5), Color.WHITE);
              StateListDrawable sl = new StateListDrawable();
              sl.addState(new int[]{android.R.attr.state_focused}, f);
              sl.addState(new int[]{android.R.attr.state_pressed}, f);
              sl.addState(new int[]{}, n);
              return sl;
            }

            int shade(int c, float f) {
              float t = Math.abs(f);
              int target = f > 0 ? 255 : 0;
              int r = Math.round(Color.red(c) + (target - Color.red(c)) * t);
              int g = Math.round(Color.green(c) + (target - Color.green(c)) * t);
              int bl = Math.round(Color.blue(c) + (target - Color.blue(c)) * t);
              return Color.argb(Color.alpha(c), r, g, bl);
            }

            void lift(View v, final int radius, int elev) {
              v.setOutlineProvider(new ViewOutlineProvider() {
                @Override public void getOutline(View x, Outline o) {
                  o.setRoundRect(0, 0, x.getWidth(), x.getHeight(), radius);
                }
              });
              v.setElevation(elev);
            }

            void pop(View v) {
              v.setOnFocusChangeListener((x, f) -> x.animate()
                  .scaleX(f ? 1.08f : 1f).scaleY(f ? 1.08f : 1f)
                  .translationZ(f ? s(16) : 0).setDuration(150).start());
            }

            TextView badge3d(String ch, int color, int size, int textPx) {
              final int r = Math.round(size * 0.24f);
              int depth = Math.round(size * 0.07f);
              GradientDrawable side = new GradientDrawable();
              side.setColor(shade(color, -0.5f));
              side.setCornerRadius(r);
              GradientDrawable face = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                  new int[]{shade(color, 0.35f), color, shade(color, -0.25f)});
              face.setCornerRadius(r);
              face.setStroke(Math.max(1, s(2)), shade(color, 0.55f));
              GradientDrawable gloss = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                  new int[]{0x88FFFFFF, 0x00FFFFFF});
              float gr = r * 0.8f;
              gloss.setCornerRadii(new float[]{gr, gr, gr, gr, 0, 0, 0, 0});
              LayerDrawable ld = new LayerDrawable(new Drawable[]{side, face, gloss});
              ld.setLayerInset(1, 0, 0, 0, depth);
              int gi = Math.round(size * 0.05f);
              ld.setLayerInset(2, gi, gi, gi, Math.round(size * 0.55f));
              TextView tv = text(ch, textPx, Color.WHITE);
              tv.setTypeface(Typeface.DEFAULT_BOLD);
              tv.setShadowLayer(s(4), 0, s(3), 0xAA000000);
              tv.setPadding(0, 0, 0, depth);
              tv.setBackground(ld);
              lift(tv, r, s(10));
              return tv;
            }

            Drawable card3d(int radius) {
              GradientDrawable n = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                  new int[]{0x55FFFFFF, 0x1AFFFFFF});
              n.setCornerRadius(radius);
              n.setStroke(s(2), 0x44FFFFFF);
              GradientDrawable f = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                  new int[]{0x99FFFFFF, 0x44FFFFFF});
              f.setCornerRadius(radius);
              f.setStroke(s(5), Color.WHITE);
              StateListDrawable sl = new StateListDrawable();
              sl.addState(new int[]{android.R.attr.state_focused}, f);
              sl.addState(new int[]{android.R.attr.state_pressed}, f);
              sl.addState(new int[]{}, n);
              return sl;
            }

            Drawable shadowIcon(Drawable d, int size) {
              int pad = s(24);
              Bitmap src = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
              Canvas sc = new Canvas(src);
              d.setBounds(0, 0, size, size);
              d.draw(sc);
              int full = size + pad * 2;
              Bitmap out = Bitmap.createBitmap(full, full, Bitmap.Config.ARGB_8888);
              Canvas oc = new Canvas(out);
              Paint bp = new Paint();
              bp.setMaskFilter(new BlurMaskFilter(s(12), BlurMaskFilter.Blur.NORMAL));
              int[] off = new int[2];
              Bitmap alpha = src.extractAlpha(bp, off);
              Paint sp = new Paint();
              sp.setColor(0xCC000000);
              oc.drawBitmap(alpha, pad + off[0], pad + off[1] + s(10), sp);
              oc.drawBitmap(src, pad, pad - s(4), null);
              return new BitmapDrawable(getResources(), out);
            }

            TextView text(String t, int px, int color) {
              TextView tv = new TextView(this);
              tv.setText(t);
              tv.setTextColor(color);
              tv.setTextSize(TypedValue.COMPLEX_UNIT_PX, px);
              tv.setGravity(Gravity.CENTER);
              return tv;
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              u = getResources().getDisplayMetrics().widthPixels / 1920f;
              prefs = getSharedPreferences("launcher", MODE_PRIVATE);

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(s(80), s(50), s(80), s(40));
              root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                  new int[]{0xFF0A0F2E, 0xFF1B1464, 0xFF4A1D7A}));

              LinearLayout top = new LinearLayout(this);
              top.setOrientation(LinearLayout.VERTICAL);
              clockTv = new TextView(this);
              clockTv.setTypeface(Typeface.DEFAULT_BOLD);
              clockTv.setTextSize(TypedValue.COMPLEX_UNIT_PX, s(84));
              clockTv.setSingleLine(true);
              dateTv = new TextView(this);
              dateTv.setTextSize(TypedValue.COMPLEX_UNIT_PX, s(36));
              dateTv.setSingleLine(true);
              top.addView(clockTv);
              top.addView(dateTv);
              weatherTv = new TextView(this);
              weatherTv.setTextSize(TypedValue.COMPLEX_UNIT_PX, s(34));
              weatherTv.setTextColor(Color.WHITE);
              weatherTv.setMaxLines(2);
              weatherTv.setFocusable(true);
              weatherTv.setClickable(true);
              weatherTv.setPadding(s(8), s(6), s(8), s(6));
              weatherTv.setBackground(bg(0x00000000, 0x44FFFFFF, s(14)));
              weatherTv.setOnClickListener(v -> pickCity());
              LinearLayout.LayoutParams wlp = new LinearLayout.LayoutParams(WRAP, WRAP);
              wlp.topMargin = s(10);
              top.addView(weatherTv, wlp);
              String cachedWx = prefs.getString("wx", null);
              if (cachedWx != null) showWeather(cachedWx);
              else weatherTv.setText("Weather: loading...");
              LinearLayout topRow = new LinearLayout(this);
              topRow.setOrientation(LinearLayout.HORIZONTAL);
              topRow.addView(top, new LinearLayout.LayoutParams(0, WRAP, 1f));
              for (int k = 3; k >= 0; k--) {
                ImageView pv = new ImageView(this);
                pv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                pv.setVisibility(View.GONE);
                pv.setOutlineProvider(new ViewOutlineProvider() {
                  @Override public void getOutline(View v, Outline o) {
                    o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), s(24));
                  }
                });
                pv.setClipToOutline(true);
                LinearLayout.LayoutParams plp = new LinearLayout.LayoutParams(s(210), s(260));
                plp.leftMargin = s(16);
                topRow.addView(pv, plp);
                photos[k] = pv;
              }
              root.addView(topRow, new LinearLayout.LayoutParams(MATCH, WRAP));

              HorizontalScrollView sv = new HorizontalScrollView(this);
              sv.setHorizontalScrollBarEnabled(false);
              sv.setFillViewport(true);
              sv.setClipToPadding(false);
              sv.setPadding(s(10), s(20), s(10), s(20));
              tileRow = new LinearLayout(this);
              tileRow.setGravity(Gravity.CENTER_VERTICAL | Gravity.START);
              sv.addView(tileRow, new FrameLayout.LayoutParams(WRAP, MATCH));
              root.addView(sv, new LinearLayout.LayoutParams(MATCH, 0, 1f));

              LinearLayout bar = new LinearLayout(this);
              bar.setGravity(Gravity.CENTER);
              bar.setPadding(s(20), s(14), s(20), s(14));
              GradientDrawable barBg = new GradientDrawable();
              barBg.setColor(0x44000000);
              barBg.setCornerRadius(s(36));
              bar.setBackground(barBg);
              String[][] menu = {
                {"Installation", "#E91E63", "main"},
                {"Channel", "#FF9800", "live"},
                {"Update", "#4CAF50", "upd"},
                {"Network", "#03A9F4", "set"},
                {"Settings", "#9C27B0", "set"},
                {"Other", "#607D8B", "other"}
              };
              for (final String[] m : menu) {
                LinearLayout item = new LinearLayout(this);
                item.setOrientation(LinearLayout.VERTICAL);
                item.setGravity(Gravity.CENTER);
                item.setFocusable(true);
                item.setClickable(true);
                item.setPadding(s(10), s(12), s(10), s(12));
                item.setBackground(bg(0x00000000, 0x55FFFFFF, s(24)));
                pop(item);
                TextView badge = badge3d(m[0].substring(0, 1), Color.parseColor(m[1]), s(100), s(46));
                item.addView(badge, new LinearLayout.LayoutParams(s(100), s(100)));
                TextView lab = text(m[0], s(26), Color.WHITE);
                LinearLayout.LayoutParams llp = new LinearLayout.LayoutParams(WRAP, WRAP);
                llp.topMargin = s(8);
                item.addView(lab, llp);
                LinearLayout.LayoutParams ilp = new LinearLayout.LayoutParams(s(200), WRAP);
                ilp.setMargins(s(8), 0, s(8), 0);
                item.setLayoutParams(ilp);
                item.setOnClickListener(v -> {
                  if (m[2].equals("set")) open(SET_PKG, SET_CLS);
                  else if (m[2].equals("upd")) open(OLD_PKG, UPD_CLS);
                  else if (m[2].equals("live")) open(OLD_PKG, LIVE_CLS);
                  else if (m[2].equals("other")) openOther();
                  else open(OLD_PKG, MAIN_CLS);
                });
                bar.addView(item);
              }
              root.addView(bar, new LinearLayout.LayoutParams(MATCH, WRAP));
              setContentView(root);
            }

            @Override protected void onResume() {
              super.onResume();
              loadPhoto();
              maybeWeather();
              refresh();
              handler.removeCallbacks(tick);
              handler.post(tick);
            }

            List<String> getTiles() {
              String str = prefs.getString("tiles", "com.google.android.youtube.tv|com.datesplus.iptv");
              List<String> l = new ArrayList<>();
              for (String x : str.split("\\|")) if (!x.isEmpty()) l.add(x);
              return l;
            }

            void saveTiles(List<String> l) {
              prefs.edit().putString("tiles", TextUtils.join("|", l)).apply();
            }

            View makeTile(Drawable icon, String label) {
              LinearLayout t = new LinearLayout(this);
              t.setOrientation(LinearLayout.VERTICAL);
              t.setGravity(Gravity.CENTER);
              t.setFocusable(true);
              t.setClickable(true);
              t.setBackground(card3d(s(28)));
              lift(t, s(28), s(12));
              pop(t);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(s(300), s(340));
              lp.setMargins(s(16), 0, s(16), 0);
              t.setLayoutParams(lp);
              if (icon != null) {
                ImageView iv = new ImageView(this);
                iv.setImageDrawable(shadowIcon(icon, s(150)));
                t.addView(iv, new LinearLayout.LayoutParams(s(200), s(200)));
              } else {
                LinearLayout.LayoutParams plus = new LinearLayout.LayoutParams(s(140), s(140));
                plus.topMargin = s(30);
                plus.bottomMargin = s(30);
                t.addView(badge3d("+", 0xFF5C6BC0, s(140), s(90)), plus);
              }
              TextView tv = text(label, s(32), Color.WHITE);
              tv.setMaxLines(1);
              tv.setEllipsize(TextUtils.TruncateAt.END);
              LinearLayout.LayoutParams tlp = new LinearLayout.LayoutParams(s(270), WRAP);
              tlp.topMargin = s(16);
              t.addView(tv, tlp);
              return t;
            }

            void refresh() {
              tileRow.removeAllViews();
              PackageManager pm = getPackageManager();
              View first = null;
              for (final String p : getTiles()) {
                try {
                  ApplicationInfo ai = pm.getApplicationInfo(p, 0);
                  final String label = pm.getApplicationLabel(ai).toString();
                  View t = makeTile(pm.getApplicationIcon(ai), label);
                  t.setOnClickListener(v -> open(p, null));
                  t.setOnLongClickListener(v -> { confirmRemove(p, label); return true; });
                  tileRow.addView(t);
                  if (first == null) first = t;
                } catch (PackageManager.NameNotFoundException e) {
                }
              }
              View plus = makeTile(null, "Add app");
              plus.setOnClickListener(v -> pickApp());
              tileRow.addView(plus);
              if (first == null) first = plus;
              first.requestFocus();
            }

            void confirmRemove(final String pkg, String label) {
              new AlertDialog.Builder(this, AlertDialog.THEME_DEVICE_DEFAULT_DARK)
                .setTitle("Remove " + label + " from home?")
                .setPositiveButton("Remove", (d, w) -> {
                  List<String> l = getTiles();
                  l.remove(pkg);
                  saveTiles(l);
                  refresh();
                })
                .setNegativeButton("Cancel", null)
                .show();
            }

            void pickApp() {
              PackageManager pm = getPackageManager();
              Set<String> seen = new HashSet<>();
              final List<String[]> apps = new ArrayList<>();
              String[] cats = {Intent.CATEGORY_LAUNCHER, Intent.CATEGORY_LEANBACK_LAUNCHER};
              for (String cat : cats) {
                Intent q = new Intent(Intent.ACTION_MAIN).addCategory(cat);
                for (ResolveInfo r : pm.queryIntentActivities(q, 0)) {
                  String p = r.activityInfo.packageName;
                  if (p.equals(getPackageName()) || !seen.add(p)) continue;
                  apps.add(new String[]{r.loadLabel(pm).toString(), p});
                }
              }
              Collections.sort(apps, new Comparator<String[]>() {
                public int compare(String[] a, String[] c) { return a[0].compareToIgnoreCase(c[0]); }
              });
              String[] names = new String[apps.size()];
              for (int i = 0; i < names.length; i++) names[i] = apps.get(i)[0];
              new AlertDialog.Builder(this, AlertDialog.THEME_DEVICE_DEFAULT_DARK)
                .setTitle("Add app to home")
                .setItems(names, (d, which) -> {
                  List<String> l = getTiles();
                  String p = apps.get(which)[1];
                  if (!l.contains(p)) l.add(p);
                  saveTiles(l);
                  refresh();
                })
                .show();
            }

            void open(String pkg, String cls) {
              try {
                PackageManager pm = getPackageManager();
                Intent i = null;
                if (cls != null) {
                  i = new Intent(Intent.ACTION_MAIN);
                  i.setComponent(new ComponentName(pkg, cls));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                    startActivity(i);
                    return;
                  } catch (Exception e) {
                    i = null;
                  }
                }
                i = pm.getLaunchIntentForPackage(pkg);
                if (i == null) i = pm.getLeanbackLaunchIntentForPackage(pkg);
                startActivity(i);
              } catch (Exception e) {
                Toast.makeText(this, "Cannot open: " + pkg, Toast.LENGTH_LONG).show();
              }
            }

            @Override protected void onPause() {
              super.onPause();
              handler.removeCallbacks(tick);
            }

            void put(SpannableStringBuilder sb, String str, int color) {
              int st = sb.length();
              sb.append(str);
              sb.setSpan(new ForegroundColorSpan(color), st, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
            }

            String fmt(String pattern, Date d) {
              return new SimpleDateFormat(pattern, Locale.ENGLISH).format(d);
            }

            void updateClock() {
              Date now = new Date();
              SpannableStringBuilder sb = new SpannableStringBuilder();
              put(sb, fmt("hh", now), 0xFF4FC3F7);
              put(sb, ":", 0xFFFFFFFF);
              put(sb, fmt("mm", now), 0xFFFFD54F);
              put(sb, ":", 0xFFFFFFFF);
              put(sb, fmt("ss", now), 0xFFFF6E9C);
              put(sb, " ", 0xFFFFFFFF);
              int st = sb.length();
              put(sb, fmt("a", now), 0xFF69F0AE);
              sb.setSpan(new RelativeSizeSpan(0.45f), st, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
              clockTv.setText(sb);
              SpannableStringBuilder ds = new SpannableStringBuilder();
              put(ds, fmt("EEEE", now), 0xFFFF8A65);
              put(ds, ", ", 0xFFFFFFFF);
              put(ds, fmt("d", now), 0xFF81C784);
              put(ds, " ", 0xFFFFFFFF);
              put(ds, fmt("MMMM", now), 0xFFBA68C8);
              put(ds, " ", 0xFFFFFFFF);
              put(ds, fmt("yyyy", now), 0xFF4DD0E1);
              dateTv.setText(ds);
            }

            void maybeWeather() {
              long n = System.currentTimeMillis();
              if (n - lastWeather > 20 * 60 * 1000L) {
                lastWeather = n;
                fetchWeather();
              }
            }

            String desc(int c) {
              if (c == 0) return "Clear sky";
              if (c == 1) return "Mainly clear";
              if (c == 2) return "Partly cloudy";
              if (c == 3) return "Overcast";
              if (c == 45 || c == 48) return "Fog";
              if (c >= 51 && c <= 57) return "Drizzle";
              if (c >= 61 && c <= 67) return "Rain";
              if (c >= 71 && c <= 77) return "Snow";
              if (c >= 80 && c <= 82) return "Rain showers";
              if (c == 85 || c == 86) return "Snow showers";
              if (c >= 95) return "Thunderstorm";
              return "Weather";
            }

            void showWeather(String raw) {
              try {
                String[] p = raw.split("\\|");
                SpannableStringBuilder sb = new SpannableStringBuilder();
                put(sb, p[0] + "\u00B0C", 0xFFFFD54F);
                put(sb, "  " + desc(Integer.parseInt(p[4])), 0xFF4FC3F7);
                put(sb, "  " + p[7], 0xFFFFFFFF);
                put(sb, "\n", 0xFFFFFFFF);
                int st = sb.length();
                put(sb, "Feels " + p[1] + "\u00B0   H " + p[5] + "\u00B0   L " + p[6] + "\u00B0   Humidity " + p[2]
                    + "%   Wind " + p[3] + " km/h", 0xFFB0BEC5);
                sb.setSpan(new RelativeSizeSpan(0.72f), st, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                weatherTv.setText(sb);
              } catch (Exception e) {
                weatherTv.setText("Weather: --");
              }
            }

            int cityIdx() {
              int i = prefs.getInt("city", 0);
              return (i >= 0 && i < CITY_NAMES.length) ? i : 0;
            }

            void pickCity() {
              new AlertDialog.Builder(this, AlertDialog.THEME_DEVICE_DEFAULT_DARK)
                .setTitle("Select city for weather")
                .setItems(CITY_NAMES, (d, which) -> {
                  prefs.edit().putInt("city", which).remove("wx").apply();
                  weatherTv.setText("Weather: loading...");
                  lastWeather = System.currentTimeMillis();
                  fetchWeather();
                })
                .show();
            }

            void fetchWeather() {
              final int ci = cityIdx();
              new Thread(() -> {
                String res = null;
                String err = null;
                HttpURLConnection conn = null;
                try {
                  String url = "https://api.open-meteo.com/v1/forecast?latitude=" + CITY_POS[ci][0]
                      + "&longitude=" + CITY_POS[ci][1]
                      + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"
                      + "&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
                  conn = (HttpURLConnection) new URL(url).openConnection();
                  conn.setConnectTimeout(10000);
                  conn.setReadTimeout(10000);
                  BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                  StringBuilder body = new StringBuilder();
                  String ln;
                  while ((ln = br.readLine()) != null) body.append(ln);
                  br.close();
                  JSONObject j = new JSONObject(body.toString());
                  JSONObject cur = j.getJSONObject("current");
                  JSONObject dl = j.getJSONObject("daily");
                  res = Math.round(cur.getDouble("temperature_2m"))
                      + "|" + Math.round(cur.getDouble("apparent_temperature"))
                      + "|" + Math.round(cur.getDouble("relative_humidity_2m"))
                      + "|" + Math.round(cur.getDouble("wind_speed_10m"))
                      + "|" + cur.getInt("weather_code")
                      + "|" + Math.round(dl.getJSONArray("temperature_2m_max").getDouble(0))
                      + "|" + Math.round(dl.getJSONArray("temperature_2m_min").getDouble(0))
                      + "|" + CITY_NAMES[ci];
                } catch (Exception e) {
                  err = e.getClass().getSimpleName();
                } finally {
                  if (conn != null) conn.disconnect();
                }
                final String fr = res;
                final String fe = err;
                runOnUiThread(() -> {
                  if (fr != null) {
                    prefs.edit().putString("wx", fr).apply();
                    showWeather(fr);
                  } else {
                    lastWeather = System.currentTimeMillis() - 15 * 60 * 1000L;
                    if (prefs.getString("wx", null) == null) weatherTv.setText("Weather unavailable (" + fe + ")");
                  }
                });
              }).start();
            }

            void loadPhoto() {
              String[] names = {"launcher_photo.jpg", "launcher_photo2.jpg", "launcher_photo3.jpg", "launcher_photo4.jpg"};
              for (int k = 0; k < 4; k++) {
                loadOne(photos[k], new File(android.os.Environment.getExternalStorageDirectory(), names[k]));
              }
            }

            void loadOne(ImageView iv, File f) {
              try {
                if (!f.exists()) { iv.setVisibility(View.GONE); return; }
                BitmapFactory.Options o = new BitmapFactory.Options();
                o.inJustDecodeBounds = true;
                BitmapFactory.decodeFile(f.getPath(), o);
                int ss = 1;
                while (o.outWidth / ss > 1000 || o.outHeight / ss > 1000) ss *= 2;
                BitmapFactory.Options o2 = new BitmapFactory.Options();
                o2.inSampleSize = ss;
                Bitmap bm = BitmapFactory.decodeFile(f.getPath(), o2);
                if (bm == null) { iv.setVisibility(View.GONE); return; }
                try {
                  int ori = new ExifInterface(f.getPath()).getAttributeInt(
                      ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                  int deg = 0;
                  if (ori == ExifInterface.ORIENTATION_ROTATE_90) deg = 90;
                  else if (ori == ExifInterface.ORIENTATION_ROTATE_180) deg = 180;
                  else if (ori == ExifInterface.ORIENTATION_ROTATE_270) deg = 270;
                  if (deg != 0) {
                    Matrix mx = new Matrix();
                    mx.postRotate(deg);
                    bm = Bitmap.createBitmap(bm, 0, 0, bm.getWidth(), bm.getHeight(), mx, true);
                  }
                } catch (Exception ignored) { }
                iv.setImageBitmap(bm);
                iv.setVisibility(View.VISIBLE);
              } catch (Exception e) {
                iv.setVisibility(View.GONE);
              }
            }

            void openOther() {
              try {
                Intent i = new Intent("com.tosmart.action.ExtNavHost");
                i.setComponent(new ComponentName(OLD_PKG, "com.tosmart.stb_extend.ext_view.navigation.ExtNavHostActivity"));
                i.putExtra("host_type", "Other_Module");
                i.putExtra("from_home_as_app", true);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
              } catch (Exception e) {
                Toast.makeText(this, "Cannot open Other menu", Toast.LENGTH_LONG).show();
              }
            }

            @Override public void onBackPressed() { }
          }
